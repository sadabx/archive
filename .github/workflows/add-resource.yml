name: Process Resource Suggestion

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  process-suggestion:
    # Only run on issues with 'resource-suggestion' label
    if: contains(github.event.issue.labels.*.name, 'resource-suggestion')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process Issue Form Data
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node .github/scripts/process-resource.js

      - name: Create Pull Request
        if: steps.parse.outputs.status == 'added'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: add resource ${{ steps.parse.outputs.name }} (#${{ github.event.issue.number }})"
          branch: "resource-${{ github.event.issue.number }}"
          title: "Add Resource: ${{ steps.parse.outputs.name }} (via #${{ github.event.issue.number }})"
          body: |
            Closes #${{ github.event.issue.number }}

            ### Suggested Resource Details
            - **Name:** ${{ steps.parse.outputs.name }}
            - **URL:** ${{ steps.parse.outputs.url }}
            - **Category:** ${{ steps.parse.outputs.cat }}
            - **Submitted by:** @${{ github.event.issue.user.login }}

            *Automated by the π archive contribution workflow.*
          labels: "automated-pr, resource-suggestion"

      - name: Comment on Issue (Success)
        if: steps.parse.outputs.status == 'added'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🎉 Thanks @${context.payload.issue.user.login}! A Pull Request has been automatically generated for your submission. Once reviewed, it will be merged and appear live on the site.`
            });

      - name: Comment on Issue (Duplicate)
        if: steps.parse.outputs.status == 'duplicate'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ℹ️ Notice: The URL submitted (${process.env.url || 'this resource'}) is already present in π archive. If this is a new mirror or update, please let us know!`
            });
